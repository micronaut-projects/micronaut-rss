plugins {
    id 'java-library'
    id 'io.micronaut.build.internal.rss-tests'
}

// The examples of the guide, in Java.
dependencies {
    testAnnotationProcessor mn.micronaut.inject.java

    testImplementation projects.micronautRss
    testImplementation projects.micronautItunespodcast
    testImplementation projects.micronautJsonfeed
    testImplementation mn.micronaut.http.server.netty
    testImplementation mn.micronaut.http.client
    testImplementation mnSerde.micronaut.serde.jackson
    testImplementation mn.reactor
    testImplementation mnTest.micronaut.test.junit5

    testRuntimeOnly mnTest.junit.jupiter.engine
    testRuntimeOnly mnTest.junit.platform.launcher
    testRuntimeOnly mnLogging.logback.classic
}
